name: ci

# No untrusted input (issue/PR titles or bodies, commit messages, refs) is interpolated into the run:
# blocks below - the only inputs are the checked-out tree and pinned tool versions.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install sherpa-onnx (the permitted runtime, Apache-2.0)
        run: |
          uv venv -p 3.12 .venv
          # No torch and no nvidia-* wheels: sherpa-onnx is CPU ONNX Runtime. The removed
          # proprietary runtime needed a 1.7 GB venv for the same job - and a licence nobody has.
          uv pip install --python .venv/bin/python sherpa-onnx numpy
          .venv/bin/python -c "import sherpa_onnx; print('sherpa-onnx importable')"
          if uv pip list --python .venv/bin/python | grep -Eiq '^(moondream|kestrel)'; then
            echo "the proprietary runtime is installed - it must not be"; exit 1
          fi

      - name: gate (licence guard, host contract, missing-model and ceiling paths)
        run: .venv/bin/python check.py

      - name: venv size
        run: du -sh .venv
